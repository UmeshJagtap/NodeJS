services:
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - '8000:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  redis:
    image: redis
    ports:
      - 6379:6379

    # server:
    #   build: ./server
    #   env_file:
    #     - ./server/.env
    #   ports:
    #     - 5000:7000

  server1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="pehla server"
    ports:
      - 5001:7000

  # as containers are isolate, server can run on same ports
  server2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="doosra server"
    ports:
      - 5002:7000

  server3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="teesra server"
    ports:
      - 5003:7000

  #
  # CMD > advanced-backend-course/system-design
  # docker compose up --build
